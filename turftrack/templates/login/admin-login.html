<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | TurfTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg rounded-4" style="max-width: 420px; width: 100%;">
      <h3 class="text-center mb-1">Admin Login</h3>
      <p class="text-center text-muted mb-4 small">Only admins can access. No public signup.</p>
      <form method="POST" action="{% url 'login_admin' %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="admin@example.com" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn btn-dark w-100">Login</button>
</form>

{% if messages %}
<div class="mt-3">
    {% for message in messages %}
    <div class="alert alert-danger py-1 my-1">{{ message }}</div>
    {% endfor %}
</div>
<script>
    setTimeout(function() {
      const msg = document.getElementById("flash-message");
      if (msg) {
        msg.style.display = "none";
      }
    }, 1000); // 2000ms = 2 seconds
  </script>
{% endif %}

     <a class="d-block text-center mt-3 small" href="{% url 'index' %}">← Back to Home</a>

    </div>
  </div>
</body>
</html>
