<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turf Owner Login | TurfTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg rounded-4" style="max-width: 420px; width: 100%;">
      
      <!-- Title -->
      <h3 class="text-center mb-4">Turf Owner Login</h3>

      <!-- Django Login Form -->
      <form method="POST" action="{% url 'login_owner' %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Login</button>
</form>

      <!-- Error Messages -->
      {% if messages %}
        <div class="mt-3">
          {% for message in messages %}
            <div class="alert alert-danger py-1 my-1">{{ message }}</div>
          {% endfor %}
        </div>
        <script>
    setTimeout(function() {
      const msg = document.getElementById("flash-message");
      if (msg) {
        msg.style.display = "none";
      }
    }, 2000); // 2000ms = 2 seconds
  </script>
      {% endif %}

      <!-- Register & Back Links -->
      <p class="text-center mt-3">
        Don’t have an account? 
        <a href="{% url 'register_owner' %}">Register</a>
      </p>
      <a class="d-block text-center mt-2 small" href="{% url 'index' %}">← Back to Home</a>
    </div>
  </div>
  <script>
  setTimeout(() => {
    const alert = document.querySelector('.alert');
    if (alert) alert.remove();
  }, 2000);  // disappears after 4 seconds
</script>

</body>
</html>
