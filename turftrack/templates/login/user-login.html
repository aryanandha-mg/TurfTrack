{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login | TurfTrack</title>
  <link rel="stylesheet" href="{% static 'css/user-login.css' %}">
</head>
<body>
  <div class="login-container">
    <!-- Left Branding Section -->
    <div class="login-left">
      <div class="overlay">
        <h1 class="brand-name">TurfTrack</h1>
        <h2>Book Your Favorite Turf Instantly</h2>
        <p>
          Manage, book, and play — all in one place.  
          Bringing players and turf owners together with ease.
        </p>
      </div>
    </div>

    <!-- Right Login Section -->
    <div class="login-right">
      <div class="login-box">
        <h2>Sign In</h2>
        <form method="POST">
          {% csrf_token %}

         <div class="form-group"> 
           <label for="username">Username</label>
           <input type="text" id="username" name="username" placeholder="Enter your username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>

          <div class="form-options">
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-login">Sign In</button>

          <div class="divider">OR</div>

          <button type="button" class="btn-google">
            <img src="https://th.bing.com/th/id/OIP._CwhNAJdQclOq6xpwnVHxAHaHZ?w=158&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7" 
         alt="Google Logo" width="20" height="20" class="me-2">
            Sign in with Google
          </button>
        </form>

        <p class="signup-text">
          Are you new? <a href="{% url 'register_user' %}">Register</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
