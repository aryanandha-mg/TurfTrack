<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration | TurfTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg rounded-4" style="max-width: 520px; width: 100%;">
      <h3 class="text-center mb-4">User Registration</h3>
      {% if messages %}
        <script>
          {% for message in messages %}
            alert("{{ message|escapejs }}");
          {% endfor %}
        </script>
      {% endif %}
      <form method="POST" action="{% url 'register_user' %}" onsubmit="return validateForm()">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" id="username" name="username" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Phone</label>
      <input type="tel" class="form-control" id="phone" name="phone" required>
    </div>
    <div class="col-md-12">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="col-md-12">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
  </div>
  <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
</form>

<script>
function validateForm() {
  const username = document.getElementById('username').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  // Username validation
  const usernameRegex = /^[A-Za-z\s]+$/;
  if (!usernameRegex.test(username)) {
    alert("Username should contain only letters and spaces.");
    return false;
  }

  // Phone validation
  const phoneRegex = /^\d{10}$/;
  if (!phoneRegex.test(phone)) {
    alert("Phone number must be exactly 10 digits.");
    return false;
  }

  // Password validation
  const passwordRegex = /^(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;
  if (!passwordRegex.test(password)) {
    alert("Password must be at least 8 characters and include a special character.");
    return false;
  }

  return true;
}
</script>



      <p class="text-center mt-3">Already have an account?<a href="{% url 'login_user' %}">Login</a></p>
      <a class="d-block text-center mt-2 small"  href="{% url 'login_user' %}">Back to home</a>
  </div>
</body>
</html>
