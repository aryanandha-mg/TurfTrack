<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turf Owner Registration | TurfTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'assets/css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg rounded-4" style="max-width: 520px; width: 100%;">
      <h3 class="text-center mb-4">Turf Owner Registration</h3>

      <!-- Django Messages as Alert Boxes -->
      {% if messages %}
        <script>
          {% for message in messages %}
            alert("{{ message|escapejs }}");
          {% endfor %}
        </script>
      {% endif %}

      <!-- Registration Form -->
      <form method="POST" action="{% url 'register_owner' %}" onsubmit="return validateOwnerForm()">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="tel" id="phone" name="phone" class="form-control" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Turf Name</label>
            <input type="text" id="turf_name" name="turf_name" class="form-control" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
      </form>

      <!-- Link to Login -->
      <p class="text-center mt-3">
        Already have an account? <a href="{% url 'login_owner' %}">Login</a>
      </p>
      <a class="d-block text-center mt-2 small" href="{% url 'index' %}">← Back to Home</a>
    </div>
  </div>

  <!-- FRONTEND VALIDATION SCRIPT -->
  <script>
    function validateOwnerForm() {
      const fullName = document.getElementById('full_name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const turfName = document.getElementById('turf_name').value.trim();
      const password = document.getElementById('password').value;

      const nameRegex = /^[A-Za-z\s]+$/;
      const phoneRegex = /^\d{10}$/;
      const turfRegex = /^[A-Za-z0-9\s]+$/;
      const passwordRegex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

      if (!nameRegex.test(fullName)) {
        alert("Full name should contain only letters and spaces.");
        return false;
      }
      if (!phoneRegex.test(phone)) {
        alert("Phone number must be exactly 10 digits.");
        return false;
      }
      if (!turfRegex.test(turfName)) {
        alert("Turf name can only contain letters, numbers, and spaces.");
        return false;
      }
      if (!passwordRegex.test(password)) {
        alert("Password must be at least 8 characters, include uppercase, lowercase, a number, and a special character.");
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
